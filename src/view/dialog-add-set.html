<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Roboto', Arial, sans-serif;
        padding: 0;
        margin: 0;
        line-height: 1.5;
        color: #202124;
        font-size: 14px;
      }
      .dialog-header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid #e0e0e0;
      }
      h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 500;
        color: #202124;
      }
      .dialog-content {
        padding: 20px 24px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #5f6368;
        font-size: 13px;
        letter-spacing: 0.2px;
      }
      input, select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        font-size: 14px;
        font-family: 'Roboto', Arial, sans-serif;
        color: #202124;
        background-color: white;
        transition: border-color 0.2s;
      }
      input:hover, select:hover {
        border-color: #202124;
      }
      input:focus, select:focus {
        outline: none;
        border-color: #1a73e8;
        box-shadow: 0 0 0 1px #1a73e8;
      }
      .required {
        color: #d93025;
      }
      .dialog-footer {
        padding: 16px 24px;
        border-top: 1px solid #e0e0e0;
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        background-color: #fafafa;
      }
      button {
        padding: 8px 24px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        font-family: 'Roboto', Arial, sans-serif;
        letter-spacing: 0.25px;
        transition: background-color 0.2s, box-shadow 0.2s;
        min-width: 80px;
      }
      .btn-primary {
        background-color: #1a73e8;
        color: white;
        box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
      }
      .btn-primary:hover {
        background-color: #1765cc;
        box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
      }
      .btn-primary:active {
        background-color: #1557b0;
      }
      .btn-primary:disabled {
        background-color: #dadce0;
        color: #80868b;
        cursor: not-allowed;
        box-shadow: none;
      }
      .btn-secondary {
        background-color: white;
        color: #1a73e8;
        border: 1px solid #dadce0;
      }
      .btn-secondary:hover {
        background-color: #f8f9fa;
        border-color: #202124;
      }
      .note {
        font-size: 12px;
        color: #5f6368;
        margin-top: 6px;
      }
      .optional-fields {
        display: none;
        margin-top: 16px;
      }
      .optional-fields.expanded {
        display: block;
      }
      .toggle-options {
        color: #1a73e8;
        cursor: pointer;
        font-size: 14px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        margin-top: 8px;
        font-weight: 500;
        padding: 4px 0;
      }
      .toggle-options:hover {
        text-decoration: underline;
      }
      .toggle-icon {
        margin-left: 4px;
        font-size: 12px;
        transition: transform 0.2s;
      }
      .toggle-icon.expanded {
        transform: rotate(180deg);
      }
    </style>
  </head>
  <body>
    <div class="dialog-header">
      <h2>Add new set</h2>
    </div>

    <div class="dialog-content">
      <form id="addSetForm">
        <div class="form-group">
          <label for="setNumber">Set number <span class="required">*</span></label>
          <input type="text" id="setNumber" name="setNumber" required placeholder="e.g., 10305" autofocus>
          <div class="note">Enter the Brickset set number (without -1 suffix)</div>
        </div>

        <a class="toggle-options" id="toggleOptions">
          More options <span class="toggle-icon" id="toggleIcon">▼</span>
        </a>

        <div class="optional-fields" id="optionalFields">
          <div class="form-group">
            <label for="condition">Condition</label>
            <select id="condition" name="condition">
              <option value="Sealed" selected>Sealed</option>
              <option value="Open">Open</option>
            </select>
          </div>

          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="Wishlist" selected>Wishlist</option>
              <option value="In Collection">In Collection</option>
              <option value="Ordered">Ordered</option>
              <option value="Sold">Sold</option>
            </select>
          </div>

          <div class="form-group">
            <label for="purchasePrice">Purchase price</label>
            <input type="number" id="purchasePrice" name="purchasePrice" step="0.01" min="0" placeholder="0.00">
            <div class="note">Leave blank if not yet purchased</div>
          </div>

          <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" min="1" value="1">
          </div>
        </div>
      </form>
    </div>

    <div class="dialog-footer">
      <button type="button" class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
      <button type="submit" form="addSetForm" class="btn-primary" id="submitBtn">Add</button>
    </div>

    <script>
      // Toggle optional fields
      document.getElementById('toggleOptions').addEventListener('click', function(e) {
        e.preventDefault();
        const optionalFields = document.getElementById('optionalFields');
        const toggleIcon = document.getElementById('toggleIcon');

        optionalFields.classList.toggle('expanded');
        toggleIcon.classList.toggle('expanded');

        if (optionalFields.classList.contains('expanded')) {
          this.innerHTML = 'Less options <span class="toggle-icon expanded" id="toggleIcon">▼</span>';
        } else {
          this.innerHTML = 'More options <span class="toggle-icon" id="toggleIcon">▼</span>';
        }
      });

      document.getElementById('addSetForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');

        // Disable submit button
        submitBtn.disabled = true;
        submitBtn.textContent = 'Adding...';

        // Get form values (use defaults if optional fields not expanded)
        const setNumber = document.getElementById('setNumber').value.trim();
        const condition = document.getElementById('condition').value || 'Sealed';
        const status = document.getElementById('status').value || 'Wishlist';
        const purchasePrice = document.getElementById('purchasePrice').value || 0;
        const quantity = document.getElementById('quantity').value || 1;

        // Call the server-side function
        google.script.run
          .withSuccessHandler(function(row) {
            // Close dialog immediately - toast will show confirmation
            google.script.host.close();
          })
          .withFailureHandler(function(error) {
            alert('Error adding set: ' + error.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Add';
          })
          .addSetToSheet(setNumber, condition, status, parseFloat(purchasePrice), parseInt(quantity));
      });
    </script>
  </body>
</html>
