<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 400px;
      }
      h2 {
        margin-top: 0;
        color: #333;
      }
      .checkbox-container {
        margin: 15px 0;
      }
      .checkbox-container label {
        display: flex;
        align-items: center;
        cursor: pointer;
        padding: 8px;
        border-radius: 4px;
        transition: background-color 0.2s;
      }
      .checkbox-container label:hover {
        background-color: #f5f5f5;
      }
      .checkbox-container input[type="checkbox"] {
        margin-right: 10px;
        width: 18px;
        height: 18px;
        cursor: pointer;
      }
      .button-container {
        margin-top: 25px;
        text-align: right;
      }
      button {
        background-color: #4CAF50;
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
      }
      button:hover {
        background-color: #45a049;
      }
      button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }
      .error {
        color: #d32f2f;
        margin-top: 10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <p>Select which tracking sheets you want to create:</p>

    <div class="checkbox-container">
      <label>
        <input type="checkbox" id="trackOwned">
        <span>Track sets you own</span>
      </label>
    </div>

    <div class="checkbox-container">
      <label>
        <input type="checkbox" id="trackWantToBuy">
        <span>Track sets you would like to buy</span>
      </label>
    </div>

    <div class="error" id="error">Please select at least one option.</div>

    <div class="button-container">
      <button onclick="createSheets()">Create Sheets</button>
    </div>

    <script>
      function createSheets() {
        const trackOwned = document.getElementById('trackOwned').checked;
        const trackWantToBuy = document.getElementById('trackWantToBuy').checked;
        const errorDiv = document.getElementById('error');

        // Validate at least one checkbox is selected
        if (!trackOwned && !trackWantToBuy) {
          errorDiv.style.display = 'block';
          return;
        }

        errorDiv.style.display = 'none';

        // Disable button while processing
        const button = event.target;
        button.disabled = true;
        button.textContent = 'Creating...';

        // Call the server-side function
        google.script.run
          .withSuccessHandler(function() {
            google.script.host.close();
          })
          .withFailureHandler(function(error) {
            button.disabled = false;
            button.textContent = 'Create Sheets';
            errorDiv.textContent = 'Error: ' + error.message;
            errorDiv.style.display = 'block';
          })
          .createTrackerSheets(trackOwned, trackWantToBuy);
      }
    </script>
  </body>
</html>
